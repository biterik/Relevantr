name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Keyed on the model name: the end-to-end test needs the real local
      # embedding model, which is ~1.2 GB — never re-download it per run.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-Qwen3-Embedding-0.6B

      # CPU wheels keep the environment gigabytes smaller; macOS wheels on
      # PyPI are CPU/MPS-only already.
      - name: Install CPU-only torch (Linux/Windows)
        if: runner.os != 'macOS'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install
        run: pip install -e ".[local,test]"

      # If the download is slow or flaky, the end-to-end test skips itself
      # (it requires the model to be present in the cache) instead of flapping.
      - name: Pre-download the local embedding model
        continue-on-error: true
        timeout-minutes: 20
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen3-Embedding-0.6B')"

      - name: Run tests
        env:
          # Virtualized macOS runners report Metal as available but its
          # shader compiler fails on the model's kernels; CPU everywhere in CI.
          RELEVANTR_DEVICE: cpu
        run: pytest -v
